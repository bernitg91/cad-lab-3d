      <text x="38" y="360" fill="#172033" font-family="Arial, sans-serif" font-size="30" font-weight="800" text-anchor="start" letter-spacing="0"><tspan x="38" dy="0">Comparar rigidez e</tspan><tspan x="38" dy="38">impacto</tspan></text>
