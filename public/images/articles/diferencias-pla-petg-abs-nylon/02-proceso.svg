      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#2557a7" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#e9f1f5"/></linearGradient>
    <linearGradient id="stress" x1="0" x2="1"><stop offset="0" stop-color="#087e8b"/><stop offset="0.55" stop-color="#ff9f1c"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#172033" flood-opacity="0.13"/></filter>
  </defs><rect width="1600" height="900" fill="#fbfdff"/>
