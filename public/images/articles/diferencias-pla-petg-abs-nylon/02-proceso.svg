    <text x="1518" y="55" fill="#172033" fill-opacity="0.62" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end" letter-spacing="1.8">DIFERENCIAS-PLA-PETG-ABS-NYL</text>
    <g transform="translate(90 215)">
