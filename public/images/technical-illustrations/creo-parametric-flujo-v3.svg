<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flujo paramétrico en Creo: árbol de operaciones y prueba de regeneración</title>
  <desc id="desc">Lámina editorial con un árbol realista de referencias, croquis, extrusión, taladro y redondeo, y una comparación de una escuadra antes y después de cambiar la cota conductora de 60 a 84 milímetros.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dbe5ea" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#245a92"/>
    </marker>
    <marker id="dim-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M8 0 0 4 8 8Z" fill="#e46f2e"/>
    </marker>
    <filter id="paper-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183149" flood-opacity=".12"/>
    </filter>
    <style>
      .ui { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .kicker { font-size: 21px; font-weight: 750; letter-spacing: 2.8px; }
      .title { font-size: 43px; font-weight: 800; letter-spacing: -.8px; }
      .subtitle { font-size: 22px; font-weight: 500; }
      .panel-title { font-size: 24px; font-weight: 800; letter-spacing: .5px; }
      .row-title { font-size: 25px; font-weight: 760; }
      .row-meta { font-size: 18px; font-weight: 520; }
      .drawing-label { font-size: 21px; font-weight: 800; letter-spacing: .8px; }
      .note { font-size: 18px; font-weight: 560; }
      .small { font-size: 16px; font-weight: 600; }
      .micro { font-size: 14px; font-weight: 700; letter-spacing: 1.1px; }
      .stroke-round { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f4f7f4"/>
  <path d="M0 0H1600V12H0Z" fill="#0f9f8f"/>
  <path d="M0 12H430V18H0Z" fill="#e46f2e"/>

  <g class="ui">
    <text x="58" y="60" class="kicker" fill="#0f766e">MODELO PARAMÉTRICO · LECTURA DEL HISTORIAL</text>
    <text x="58" y="112" class="title" fill="#0b1f33">Cambiar una cota sin perder la intención de diseño</text>
    <text x="1542" y="62" text-anchor="end" class="micro" fill="#526474">ESQUEMA EDITORIAL · NO ES UNA CAPTURA DE CREO</text>

    <!-- Árbol de operaciones -->
    <g filter="url(#paper-shadow)">
      <path d="M56 154H558V792H74L56 774Z" fill="#ffffff" stroke="#b8c7d1" stroke-width="2"/>
      <path d="M56 154H558V208H56Z" fill="#0b1f33"/>
    </g>
    <text x="84" y="189" class="panel-title" fill="#ffffff">Árbol de operaciones</text>
    <text x="528" y="188" text-anchor="end" class="micro" fill="#a7f3d0">ORDEN ESTABLE</text>

    <path d="M101 241V697M101 271H132M101 361H132M101 451H132M101 541H132M101 631H132M101 697H132" fill="none" stroke="#9db0bd" stroke-width="3" class="stroke-round"/>

    <!-- Referencias -->
    <circle cx="101" cy="253" r="16" fill="#eaf3f8" stroke="#245a92" stroke-width="2"/>
    <path d="M91 253H111M101 243V263" stroke="#245a92" stroke-width="2.5" class="stroke-round"/>
    <text x="148" y="251" class="row-title" fill="#0b1f33">Referencias</text>
    <text x="148" y="278" class="row-meta" fill="#526474">FRONT · TOP · RIGHT · CSYS</text>
    <circle cx="524" cy="253" r="11" fill="#0f9f8f"/>
    <path d="m518 253 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2.7" class="stroke-round"/>

    <!-- Croquis -->
    <circle cx="101" cy="343" r="16" fill="#eaf3f8" stroke="#245a92" stroke-width="2"/>
    <path d="M91 352V335H108L113 340V352ZM108 335V341H113" fill="none" stroke="#245a92" stroke-width="2" class="stroke-round"/>
    <text x="148" y="341" class="row-title" fill="#0b1f33">Croquis 1 · perfil en L</text>
    <text x="148" y="368" class="row-meta" fill="#526474">Totalmente restringido</text>
    <rect x="447" y="326" width="77" height="29" rx="14" fill="#eaf8f5" stroke="#0f9f8f"/>
    <text x="485.5" y="346" text-anchor="middle" class="micro" fill="#0f766e">A = 60</text>

    <!-- Extrusión -->
    <circle cx="101" cy="433" r="16" fill="#eaf3f8" stroke="#245a92" stroke-width="2"/>
    <path d="m91 438 10-6 10 5-10 6Zm0 0v-9l10-6 10 5v9M101 432v11" fill="none" stroke="#245a92" stroke-width="2" class="stroke-round"/>
    <text x="148" y="431" class="row-title" fill="#0b1f33">Extrusión 1</text>
    <text x="148" y="458" class="row-meta" fill="#526474">Plano medio · espesor 12 mm</text>
    <circle cx="524" cy="433" r="11" fill="#0f9f8f"/>
    <path d="m518 433 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2.7" class="stroke-round"/>

    <!-- Taladro -->
    <circle cx="101" cy="523" r="16" fill="#eaf3f8" stroke="#245a92" stroke-width="2"/>
    <circle cx="101" cy="523" r="7" fill="none" stroke="#245a92" stroke-width="2"/>
    <path d="M101 511V535M89 523H113" stroke="#245a92" stroke-width="1.5"/>
    <text x="148" y="521" class="row-title" fill="#0b1f33">Taladro 1</text>
    <text x="148" y="548" class="row-meta" fill="#526474">Ø 8 mm · pasante · centrado en el ala</text>
    <circle cx="524" cy="523" r="11" fill="#0f9f8f"/>
    <path d="m518 523 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2.7" class="stroke-round"/>

    <!-- Redondeo -->
    <circle cx="101" cy="613" r="16" fill="#eaf3f8" stroke="#245a92" stroke-width="2"/>
    <path d="M91 624V612q0-10 10-10h11" fill="none" stroke="#245a92" stroke-width="2.5" class="stroke-round"/>
    <text x="148" y="611" class="row-title" fill="#0b1f33">Redondeo 1</text>
    <text x="148" y="638" class="row-meta" fill="#526474">R 3 mm · cuatro aristas exteriores</text>
    <circle cx="524" cy="613" r="11" fill="#0f9f8f"/>
    <path d="m518 613 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2.7" class="stroke-round"/>

    <!-- Regeneración -->
    <circle cx="101" cy="697" r="17" fill="#fff2e9" stroke="#e46f2e" stroke-width="2"/>
    <path d="M92 697a9 9 0 0 1 15-7l3-4v10h-10l4-3a6 6 0 1 0 2 8" fill="none" stroke="#e46f2e" stroke-width="2.2" class="stroke-round"/>
    <text x="148" y="695" class="row-title" fill="#0b1f33">Regenerar modelo</text>
    <text x="148" y="722" class="row-meta" fill="#526474">0 referencias perdidas · historial íntegro</text>
    <rect x="408" y="676" width="116" height="31" rx="15" fill="#0f9f8f"/>
    <text x="466" y="697" text-anchor="middle" class="micro" fill="#ffffff">CORRECTO</text>

    <path d="M84 749H526" stroke="#d6e0e6" stroke-width="2"/>
    <text x="84" y="770" class="small" fill="#526474">La geometría depende de referencias estables,</text>
    <text x="84" y="790" class="small" fill="#526474">no de aristas temporales.</text>

    <!-- Área de prueba -->
    <path d="M602 154H1544V792H602Z" fill="#ffffff" stroke="#b8c7d1" stroke-width="2"/>
    <path d="M602 154H1544V208H602Z" fill="#eaf3f8"/>
    <text x="632" y="189" class="panel-title" fill="#0b1f33">Prueba de regeneración</text>
    <text x="1514" y="188" text-anchor="end" class="micro" fill="#245a92">EDITAR UNA COTA · REGENERAR · INSPECCIONAR</text>

    <!-- Estado nominal -->
    <text x="654" y="247" class="drawing-label" fill="#245a92">01 · ESTADO NOMINAL</text>
    <text x="654" y="275" class="note" fill="#526474">A = 60 mm</text>
    <rect x="640" y="296" width="401" height="365" fill="url(#grid)" stroke="#d6e0e6"/>
    <path d="M701 565V357Q701 337 721 337H805Q825 337 825 357V491H968Q988 491 988 511V565Z" fill="#dcebf4" stroke="#174a7e" stroke-width="5" class="stroke-round"/>
    <path d="M701 565 716 581H1003L988 565M988 511l15 16v54" fill="#b9d6e8" stroke="#174a7e" stroke-width="3" class="stroke-round"/>
    <circle cx="763" cy="402" r="33" fill="#ffffff" stroke="#174a7e" stroke-width="5"/>
    <circle cx="927" cy="530" r="24" fill="#ffffff" stroke="#174a7e" stroke-width="5"/>
    <path d="M763 342V462M703 402H823M927 494V566M891 530H963" stroke="#74a6c7" stroke-width="2" stroke-dasharray="8 7"/>
    <path d="M700 612H988M700 584V626M988 584V626" fill="none" stroke="#e46f2e" stroke-width="2.5"/>
    <path d="M711 612H977" stroke="#e46f2e" stroke-width="2.5" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
    <rect x="800" y="593" width="88" height="37" fill="#ffffff"/>
    <text x="844" y="618" text-anchor="middle" class="note" fill="#b64919">60 mm</text>
    <path d="M847 379 902 342" fill="none" stroke="#245a92" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="911" y="339" class="small" fill="#245a92">Ø 8 pasante</text>

    <!-- Flecha de cambio -->
    <path d="M1039 472H1100" stroke="#e46f2e" stroke-width="6" marker-end="url(#dim-arrow)"/>
    <rect x="1023" y="420" width="93" height="35" rx="17" fill="#fff2e9" stroke="#e46f2e"/>
    <text x="1069.5" y="444" text-anchor="middle" class="micro" fill="#b64919">A + 24</text>

    <!-- Estado regenerado -->
    <text x="1128" y="247" class="drawing-label" fill="#0f766e">02 · MODELO REGENERADO</text>
    <text x="1128" y="275" class="note" fill="#526474">A = 84 mm · mismas relaciones</text>
    <rect x="1114" y="296" width="401" height="365" fill="url(#grid)" stroke="#d6e0e6"/>
    <path d="M1153 565V357Q1153 337 1173 337H1257Q1277 337 1277 357V491H1466Q1486 491 1486 511V565Z" fill="#d9f1eb" stroke="#0f766e" stroke-width="5" class="stroke-round"/>
    <path d="M1153 565 1168 581H1501L1486 565M1486 511l15 16v54" fill="#bce2d8" stroke="#0f766e" stroke-width="3" class="stroke-round"/>
    <circle cx="1215" cy="402" r="33" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <circle cx="1425" cy="530" r="24" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <path d="M1215 342V462M1155 402H1275M1425 494V566M1389 530H1461" stroke="#67b8a8" stroke-width="2" stroke-dasharray="8 7"/>
    <path d="M1152 612H1486M1152 584V626M1486 584V626" fill="none" stroke="#e46f2e" stroke-width="2.5"/>
    <path d="M1163 612H1475" stroke="#e46f2e" stroke-width="2.5" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
    <rect x="1273" y="593" width="94" height="37" fill="#ffffff"/>
    <text x="1320" y="618" text-anchor="middle" class="note" fill="#b64919">84 mm</text>
    <path d="M1441 442l13 13 27-31" fill="none" stroke="#0f9f8f" stroke-width="8" class="stroke-round"/>

    <!-- Verificaciones -->
    <path d="M632 700H1514" stroke="#d6e0e6" stroke-width="2"/>
    <g transform="translate(646 718)">
      <circle cx="16" cy="16" r="16" fill="#0f9f8f"/>
      <path d="m8 16 6 6 11-13" fill="none" stroke="#ffffff" stroke-width="3.5" class="stroke-round"/>
      <text x="44" y="13" class="small" fill="#0b1f33">Croquis restringido</text>
      <text x="44" y="36" class="micro" fill="#526474">A controla la longitud</text>
    </g>
    <g transform="translate(930 718)">
      <circle cx="16" cy="16" r="16" fill="#0f9f8f"/>
      <path d="m8 16 6 6 11-13" fill="none" stroke="#ffffff" stroke-width="3.5" class="stroke-round"/>
      <text x="44" y="13" class="small" fill="#0b1f33">Taladro centrado</text>
      <text x="44" y="36" class="micro" fill="#526474">Conserva la referencia</text>
    </g>
    <g transform="translate(1204 718)">
      <circle cx="16" cy="16" r="16" fill="#0f9f8f"/>
      <path d="m8 16 6 6 11-13" fill="none" stroke="#ffffff" stroke-width="3.5" class="stroke-round"/>
      <text x="44" y="13" class="small" fill="#0b1f33">Redondeos válidos</text>
      <text x="44" y="36" class="micro" fill="#526474">Sin referencias perdidas</text>
    </g>

    <text x="58" y="858" class="small" fill="#526474">Lectura propuesta: el árbol explica cómo se construyó; la prueba demuestra si el modelo admite cambios previsibles.</text>
    <text x="1542" y="858" text-anchor="end" class="micro" fill="#0f766e">CAD LAB 3D · LÁMINA TÉCNICA</text>
  </g>
</svg>
