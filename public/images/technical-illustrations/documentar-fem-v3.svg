<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cómo documentar un análisis FEM básico</title>
  <desc id="desc">Lámina editorial que separa la definición de hipótesis, material, carga y apoyo, la malla, la salida con magnitud, unidades y escala, y cuatro verificaciones. Todos los valores se identifican como didácticos y la lámina no representa un cálculo realizado.</desc>
  <defs>
    <linearGradient id="result-scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#174a7e"/>
      <stop offset=".38" stop-color="#268ba1"/>
      <stop offset=".68" stop-color="#0f9f8f"/>
      <stop offset="1" stop-color="#e46f2e"/>
    </linearGradient>
    <linearGradient id="legend-scale" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#174a7e"/>
      <stop offset=".5" stop-color="#0f9f8f"/>
      <stop offset="1" stop-color="#e46f2e"/>
    </linearGradient>
    <pattern id="mesh" width="34" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 30 17 0 34 30ZM0 0 17 30 34 0" fill="none" stroke="#174a7e" stroke-width="1.7"/>
    </pattern>
    <clipPath id="mesh-clip">
      <path d="M560 444V261Q560 239 582 239H660Q682 239 682 261V364H817Q839 364 839 386V444Z"/>
    </clipPath>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#245a92"/>
    </marker>
    <marker id="load-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#e46f2e"/>
    </marker>
    <style>
      .ui { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .kicker { font-size: 21px; font-weight: 760; letter-spacing: 2.7px; }
      .title { font-size: 43px; font-weight: 820; letter-spacing: -.8px; }
      .section { font-size: 25px; font-weight: 820; letter-spacing: .4px; }
      .label { font-size: 20px; font-weight: 780; letter-spacing: .3px; }
      .value { font-size: 20px; font-weight: 540; }
      .note { font-size: 18px; font-weight: 560; }
      .small { font-size: 16px; font-weight: 620; }
      .micro { font-size: 14px; font-weight: 740; letter-spacing: 1.1px; }
      .stroke-round { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f4f7f4"/>
  <path d="M0 0H1600V12H0Z" fill="#245a92"/>
  <path d="M1180 12H1600V18H1180Z" fill="#e46f2e"/>

  <g class="ui">
    <text x="58" y="60" class="kicker" fill="#0f766e">FEM BÁSICO · QUÉ HAY QUE DEJAR REGISTRADO</text>
    <text x="58" y="112" class="title" fill="#0b1f33">Del planteamiento a una conclusión verificable</text>
    <rect x="1164" y="39" width="378" height="44" fill="#fff2e9" stroke="#e46f2e" stroke-width="2"/>
    <text x="1353" y="67" text-anchor="middle" class="micro" fill="#b64919">ESQUEMA DIDÁCTICO · NO ES UN RESULTADO DE CÁLCULO</text>

    <!-- 01: ficha de entrada -->
    <path d="M56 154H454V714L418 750H56Z" fill="#ffffff" stroke="#b8c7d1" stroke-width="2"/>
    <path d="M56 154H454V211H56Z" fill="#0b1f33"/>
    <text x="82" y="190" class="section" fill="#ffffff">01 · Definir el caso</text>

    <!-- Esquema de carga y apoyo -->
    <path d="M107 401V276Q107 260 123 260H184Q200 260 200 276V352H346Q362 352 362 368V401Z" fill="#eaf3f8" stroke="#174a7e" stroke-width="4" class="stroke-round"/>
    <circle cx="154" cy="311" r="23" fill="#ffffff" stroke="#174a7e" stroke-width="4"/>
    <circle cx="313" cy="376" r="18" fill="#ffffff" stroke="#174a7e" stroke-width="4"/>
    <path d="M91 261 69 274M91 285 69 298M91 309 69 322M91 333 69 346M91 357 69 370M91 381 69 394" stroke="#245a92" stroke-width="3"/>
    <path d="M279 243V331M314 243V331M349 243V331" stroke="#e46f2e" stroke-width="5" marker-end="url(#load-arrow)"/>
    <text x="314" y="235" text-anchor="middle" class="label" fill="#b64919">F = 1,20 kN</text>
    <text x="78" y="430" class="small" fill="#245a92">Empotramiento</text>
    <text x="362" y="430" text-anchor="end" class="small" fill="#b64919">Carga distribuida</text>

    <path d="M80 464H430" stroke="#d6e0e6" stroke-width="2"/>
    <text x="82" y="497" class="label" fill="#0b1f33">Hipótesis</text>
    <text x="212" y="497" class="value" fill="#526474">Elástico lineal</text>
    <text x="82" y="539" class="label" fill="#0b1f33">Idealización</text>
    <text x="212" y="539" class="value" fill="#526474">Placa 2D · e = 6 mm</text>
    <text x="82" y="581" class="label" fill="#0b1f33">Material</text>
    <text x="212" y="581" class="value" fill="#526474">Acero · E = 210 GPa · ν = 0,30</text>
    <text x="82" y="623" class="label" fill="#0b1f33">Carga</text>
    <text x="212" y="623" class="value" fill="#526474">1,20 kN hacia −Y</text>
    <text x="82" y="665" class="label" fill="#0b1f33">Apoyo</text>
    <text x="212" y="665" class="value" fill="#526474">Borde vertical empotrado</text>
    <text x="82" y="704" class="micro" fill="#0f766e">REGISTRAR: GEOMETRÍA · UNIDADES</text>
    <text x="82" y="727" class="micro" fill="#0f766e">Y SIMPLIFICACIONES DEL MODELO</text>

    <!-- Flujo a la malla -->
    <path d="M468 346H512" stroke="#245a92" stroke-width="4" marker-end="url(#flow-arrow)"/>
    <text x="490" y="328" text-anchor="middle" class="micro" fill="#245a92">DISCRETIZAR</text>

    <!-- 02: malla -->
    <path d="M526 154H867V530H526Z" fill="#ffffff" stroke="#b8c7d1" stroke-width="2"/>
    <path d="M526 154H867V211H526Z" fill="#eaf3f8"/>
    <text x="550" y="190" class="section" fill="#174a7e">02 · Construir la malla</text>
    <path d="M560 444V261Q560 239 582 239H660Q682 239 682 261V364H817Q839 364 839 386V444Z" fill="#f8fbfd" stroke="#174a7e" stroke-width="4" class="stroke-round"/>
    <rect x="540" y="225" width="320" height="235" fill="url(#mesh)" clip-path="url(#mesh-clip)"/>
    <circle cx="621" cy="303" r="28" fill="#ffffff" stroke="#174a7e" stroke-width="4"/>
    <circle cx="791" cy="403" r="20" fill="#ffffff" stroke="#174a7e" stroke-width="4"/>
    <circle cx="668" cy="355" r="48" fill="none" stroke="#e46f2e" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M701 322 760 270" stroke="#e46f2e" stroke-width="2.5" marker-end="url(#load-arrow)"/>
    <text x="786" y="259" text-anchor="middle" class="small" fill="#b64919">Refino en el radio</text>
    <text x="550" y="478" class="small" fill="#526474">Elemento: triángulo cuadrático</text>
    <text x="550" y="503" class="small" fill="#526474">Tamaño: global 4 mm · local 1,5 mm</text>
    <text x="550" y="524" class="micro" fill="#b64919">VALORES DIDÁCTICOS · JUSTIFICAR EL CRITERIO REAL</text>

    <!-- Flujo al resultado -->
    <path d="M881 346H925" stroke="#245a92" stroke-width="4" marker-end="url(#flow-arrow)"/>
    <text x="903" y="328" text-anchor="middle" class="micro" fill="#245a92">RESOLVER</text>

    <!-- 03: salida documentada -->
    <path d="M939 154H1544V510H939Z" fill="#ffffff" stroke="#b8c7d1" stroke-width="2"/>
    <path d="M939 154H1544V211H939Z" fill="#eaf8f5"/>
    <text x="965" y="190" class="section" fill="#0f766e">03 · Presentar una salida legible</text>

    <path d="M982 434V263Q982 242 1003 242H1076Q1097 242 1097 263V354H1237Q1258 354 1258 375V434Z" fill="url(#result-scale)" stroke="#0b1f33" stroke-width="4" class="stroke-round"/>
    <circle cx="1039" cy="303" r="25" fill="#ffffff" fill-opacity=".94" stroke="#0b1f33" stroke-width="4"/>
    <circle cx="1215" cy="394" r="19" fill="#ffffff" fill-opacity=".94" stroke="#0b1f33" stroke-width="4"/>
    <path d="M982 434V263M972 260 992 260" stroke="#0b1f33" stroke-width="7"/>
    <path d="M1190 225V325M1224 225V325" stroke="#e46f2e" stroke-width="5" marker-end="url(#load-arrow)"/>
    <text x="1118" y="467" text-anchor="middle" class="micro" fill="#b64919">FORMA DEFORMADA ×10 · EJEMPLO DE PRESENTACIÓN</text>

    <!-- Leyenda -->
    <rect x="1300" y="247" width="25" height="197" fill="url(#legend-scale)" stroke="#8799a6"/>
    <text x="1287" y="239" class="label" fill="#0b1f33">|u| [mm]</text>
    <text x="1339" y="260" class="small" fill="#526474">0,36</text>
    <text x="1339" y="308" class="small" fill="#526474">0,27</text>
    <text x="1339" y="356" class="small" fill="#526474">0,18</text>
    <text x="1339" y="404" class="small" fill="#526474">0,09</text>
    <text x="1339" y="446" class="small" fill="#526474">0,00</text>
    <path d="M1407 264H1518M1407 309H1518M1407 354H1518M1407 399H1518M1407 444H1518" stroke="#d6e0e6" stroke-width="2"/>
    <text x="1360" y="287" class="small" fill="#0b1f33">Magnitud: |u| total</text>
    <text x="1360" y="332" class="small" fill="#0b1f33">Unidad: mm</text>
    <text x="1360" y="377" class="small" fill="#0b1f33">Deformada: ×10</text>
    <text x="1360" y="422" class="small" fill="#0b1f33">Mínimo / máximo</text>
    <text x="1360" y="467" class="micro" fill="#b64919">ESCALA ILUSTRATIVA</text>

    <!-- 04: verificación -->
    <path d="M492 546H1544V750H528L492 714Z" fill="#0b1f33"/>
    <text x="526" y="590" class="section" fill="#ffffff">04 · Verificar antes de concluir</text>
    <text x="1510" y="588" text-anchor="end" class="micro" fill="#a7f3d0">UNA IMAGEN DE COLORES NO ES UNA VALIDACIÓN</text>

    <g transform="translate(526 620)">
      <circle cx="17" cy="17" r="17" fill="#0f9f8f"/>
      <path d="m9 17 6 6 11-13" fill="none" stroke="#ffffff" stroke-width="3.5" class="stroke-round"/>
      <text x="48" y="14" class="label" fill="#ffffff">Equilibrio</text>
      <text x="48" y="42" class="note" fill="#c7d4dc">ΣF + ΣR ≈ 0</text>
      <text x="48" y="68" class="small" fill="#91a5b3">Cargas = reacciones.</text>
    </g>
    <g transform="translate(775 620)">
      <circle cx="17" cy="17" r="17" fill="#0f9f8f"/>
      <path d="m9 17 6 6 11-13" fill="none" stroke="#ffffff" stroke-width="3.5" class="stroke-round"/>
      <text x="48" y="14" class="label" fill="#ffffff">Convergencia</text>
      <text x="48" y="42" class="note" fill="#c7d4dc">Refinar y comparar Δu</text>
      <text x="48" y="68" class="small" fill="#91a5b3">Declarar criterio.</text>
    </g>
    <g transform="translate(1046 620)">
      <circle cx="17" cy="17" r="17" fill="#0f9f8f"/>
      <path d="m9 17 6 6 11-13" fill="none" stroke="#ffffff" stroke-width="3.5" class="stroke-round"/>
      <text x="48" y="14" class="label" fill="#ffffff">Coherencia física</text>
      <text x="48" y="42" class="note" fill="#c7d4dc">Forma + orden de magnitud</text>
      <text x="48" y="68" class="small" fill="#91a5b3">Revisar apoyo y carga.</text>
    </g>
    <g transform="translate(1322 620)">
      <circle cx="17" cy="17" r="17" fill="#0f9f8f"/>
      <path d="m9 17 6 6 11-13" fill="none" stroke="#ffffff" stroke-width="3.5" class="stroke-round"/>
      <text x="48" y="14" class="label" fill="#ffffff">Límites</text>
      <text x="48" y="42" class="note" fill="#c7d4dc">Qué no demuestra</text>
      <text x="48" y="68" class="small" fill="#91a5b3">No extrapolar el modelo.</text>
    </g>

    <rect x="56" y="778" width="1488" height="67" fill="#ffffff" stroke="#b8c7d1" stroke-width="2"/>
    <path d="M56 778H70V845H56Z" fill="#e46f2e"/>
    <text x="91" y="808" class="label" fill="#0b1f33">La conclusión debe citar el modelo:</text>
    <text x="465" y="808" class="value" fill="#526474">“Bajo estas hipótesis y esta malla…”</text>
    <text x="91" y="834" class="small" fill="#526474">Guardar versión, geometría, propiedades, condiciones de contorno, malla, unidades, escala y comprobaciones.</text>
    <text x="1518" y="820" text-anchor="end" class="micro" fill="#0f766e">CAD LAB 3D · LÁMINA TÉCNICA</text>
  </g>
</svg>
